<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lens4chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4">

    <div id="webBlocker" class="hidden h-screen w-full flex items-center justify-center">
        <div class="text-center bg-white p-6 rounded-xl shadow-md max-w-sm w-full">
            <h2 class="text-xl font-bold text-red-500 mb-2">Access denied</h2>
            <p class="text-gray-600 text-sm">Go to @lens4chat_bot Telegram bot</p>
        </div>
    </div>

    <div id="appContent" class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl p-5 hidden">
        
        <div id="listView">
            <div class="flex justify-between items-center mb-5">
                <h2 class="text-lg font-bold">Мои подписки</h2>
                <button onclick="showForm()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-1 px-3 rounded text-sm transition-colors">+ Новая</button>
            </div>
            <div id="subsContainer" class="space-y-3">
                <p class="text-gray-500 text-sm text-center">Загрузка...</p>
            </div>
        </div>

        <div id="formView" class="hidden">
            <div class="flex items-center mb-4">
                <button onclick="showList()" class="text-gray-400 hover:text-blue-500 font-bold mr-3 transition-colors">← Назад</button>
                <h2 class="text-lg font-bold">Новая подписка</h2>
            </div>
            
            <div class="mb-3">
                <label class="block text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wide">Название</label>
                <input type="text" id="title" class="w-full p-2 text-sm border border-gray-200 rounded-md focus:outline-none focus:border-blue-400" placeholder="Например: Поиск ноутбуков">
            </div>

            <div class="mb-3">
                <label class="block text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wide">Ключевые слова (через запятую)</label>
                <textarea id="keywords" rows="2" class="w-full p-2 text-sm border border-gray-200 rounded-md focus:outline-none focus:border-blue-400" placeholder="ноутбук, macbook, лэптоп"></textarea>
            </div>

            <div class="mb-4">
                <label class="block text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wide">Ссылки на чаты (каждая с новой строки)</label>
                <textarea id="chats" rows="4" class="w-full p-2 text-sm border border-gray-200 rounded-md focus:outline-none focus:border-blue-400" placeholder="https://t.me/chat1&#10;@chat2"></textarea>
            </div>

            <button id="saveBtn" onclick="saveSub()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2.5 px-4 rounded text-sm transition-colors">
                Сохранить и запустить
            </button>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const webBlocker = document.getElementById('webBlocker');
        const appContent = document.getElementById('appContent');
        const listView = document.getElementById('listView');
        const formView = document.getElementById('formView');
        const container = document.getElementById('subsContainer');

        // Check if opened inside Telegram
        if (!tg.initDataUnsafe || !tg.initDataUnsafe.user) {
            webBlocker.classList.remove('hidden');
            webBlocker.classList.add('flex');
        } else {
            appContent.classList.remove('hidden');
            var userId = tg.initDataUnsafe.user.id;
            loadSubs();
        }

        function showForm() {
            listView.classList.add('hidden');
            formView.classList.remove('hidden');
            document.getElementById('title').value = '';
            document.getElementById('keywords').value = '';
            document.getElementById('chats').value = '';
        }

        function showList() {
            formView.classList.add('hidden');
            listView.classList.remove('hidden');
            loadSubs();
        }

        async function loadSubs() {
            try {
                const res = await fetch(`/api/subs?tg_id=${userId}`);
                const data = await res.json();
                
                container.innerHTML = '';
                if(data.length === 0) {
                    container.innerHTML = '<p class="text-gray-400 text-sm text-center py-4">У вас пока нет подписок.</p>';
                    return;
                }

                data.forEach(sub => {
                    const card = document.createElement('div');
                    card.className = 'border border-gray-100 rounded-lg p-3 relative bg-slate-50 shadow-sm';
                    
                    // Format keywords as small tags
                    const kwHtml = sub.keywords.map(k => 
                        `<span class="inline-block bg-blue-100 text-blue-800 text-[10px] px-1.5 py-0.5 rounded-sm mr-1 mb-1 font-medium">${k}</span>`
                    ).join('');
                    
                    // Extract strings from chat objects and join them
                    const chatsStr = sub.chats.map(c => c.link).join(', ');

                    card.innerHTML = `
                        <div class="pr-14 mb-2">
                            <h3 class="font-bold text-[15px] text-slate-800 leading-tight">${sub.title}</h3>
                        </div>
                        
                        <div class="mb-1">
                            ${kwHtml || '<span class="text-xs text-gray-400">Нет слов</span>'}
                        </div>
                        
                        <p class="text-[11px] text-gray-500 truncate" title="${chatsStr}">
                            <span class="font-semibold text-gray-400 uppercase tracking-wide text-[9px]">Чаты:</span> ${chatsStr || 'Нет чатов'}
                        </p>
                        
                        <button onclick="deleteSub(${sub.id})" class="absolute top-3 right-3 text-red-400 hover:text-red-600 text-xs font-bold transition-colors">Удалить</button>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                container.innerHTML = '<p class="text-red-500 text-sm text-center">Ошибка загрузки.</p>';
            }
        }

        async function deleteSub(subId) {
            // Confirm deletion
            if(!confirm("Удалить эту подписку?")) return;
            await fetch(`/api/subs/${subId}?tg_id=${userId}`, { method: 'DELETE' });
            loadSubs();
        }

        async function saveSub() {
            const btn = document.getElementById('saveBtn');
            btn.innerText = "Загрузка...";
            btn.disabled = true;

            const payload = {
                tg_id: userId,
                title: document.getElementById('title').value || "Без названия",
                keywords: document.getElementById('keywords').value,
                chats: document.getElementById('chats').value
            };

            try {
                const res = await fetch('/api/subs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                
                if (result.errors && result.errors.length > 0) {
                    alert("Подписка создана, НО бот не смог вступить в следующие чаты (возможно, ссылка неверная или нужна капча):\n\n" + result.errors.join("\n"));
                }
                showList();
            } catch (e) {
                alert("Ошибка сохранения.");
            } finally {
                btn.innerText = "Сохранить и запустить";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
